version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: majifix_user
      POSTGRES_PASSWORD: majifix_pass
      POSTGRES_DB: majifix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majifix_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://majifix_user:majifix_pass@postgres:5432/majifix
      JWT_SECRET: dev_secret_key_change_in_production
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: node:18-alpine
    working_dir: /app
    environment:
      REACT_APP_API_URL: https://majifix.onrender.com/api
    ports:
      - "3000:3000"
    volumes:
      - ./majifix-frontend/majifix-frontend:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data: